{% extends "admin/change_form.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<style>
    .test-message-btn {
        display: inline-block;
        margin-top: 8px;
        padding: 8px 16px;
        background-color: #417690;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        text-decoration: none;
        transition: background-color 0.3s;
    }

    .test-message-btn:hover {
        background-color: #2e5266;
    }

    .field-message_ru .test-message-btn {
        background-color: #4CAF50;
    }

    .field-message_ru .test-message-btn:hover {
        background-color: #45a049;
    }

    .field-message_en .test-message-btn {
        background-color: #2196F3;
    }

    .field-message_en .test-message-btn:hover {
        background-color: #0b7dda;
    }

    .field-message_uz .test-message-btn {
        background-color: #FF9800;
    }

    .field-message_uz .test-message-btn:hover {
        background-color: #e68900;
    }

    /* Стили для модального окна - ТЁМНАЯ ТЕМА */
    .modal {
        display: none;
        position: fixed;
        z-index: 9999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.7);
        animation: fadeIn 0.2s;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .modal-content {
        background-color: #2c2c2c;
        margin: 10% auto;
        padding: 30px;
        border: 1px solid #444;
        border-radius: 8px;
        width: 450px;
        max-width: 90%;
        box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        animation: slideDown 0.3s;
    }

    @keyframes slideDown {
        from {
            transform: translateY(-50px);
            opacity: 0;
        }
        to {
            transform: translateY(0);
            opacity: 1;
        }
    }

    .modal-header {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 20px;
        color: #fff;
        padding-bottom: 15px;
        border-bottom: 2px solid #444;
    }

    .modal-body {
        margin-bottom: 25px;
    }

    .modal-body p {
        color: #ccc;
        margin-bottom: 15px;
        font-size: 14px;
    }

    .modal-body p strong {
        color: #fff;
    }

    .modal-body label {
        display: block;
        margin-bottom: 10px;
        font-weight: 500;
        color: #ddd;
        font-size: 14px;
    }

    .modal-body input {
        width: 100%;
        padding: 12px;
        border: 1px solid #555;
        border-radius: 4px;
        font-size: 14px;
        box-sizing: border-box;
        background-color: #1a1a1a;
        color: #fff;
        transition: border-color 0.3s;
    }

    .modal-body input:focus {
        outline: none;
        border-color: #417690;
        background-color: #252525;
    }

    .modal-body input::placeholder {
        color: #777;
    }

    .modal-footer {
        text-align: right;
        padding-top: 15px;
        border-top: 1px solid #444;
    }

    .modal-btn {
        padding: 10px 24px;
        margin-left: 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.3s;
    }

    .modal-btn-cancel {
        background-color: #3a3a3a;
        color: #ddd;
    }

    .modal-btn-cancel:hover {
        background-color: #4a4a4a;
    }

    .modal-btn-send {
        background-color: #417690;
        color: white;
    }

    .modal-btn-send:hover {
        background-color: #2e5266;
    }

    .modal-btn-send:disabled {
        background-color: #555;
        cursor: not-allowed;
        opacity: 0.6;
    }

    .modal-result {
        margin-top: 15px;
        padding: 12px 15px;
        border-radius: 4px;
        display: none;
        font-size: 13px;
        animation: slideIn 0.3s;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .modal-result.success {
        background-color: #1e4d2b;
        border: 1px solid #2d7a3e;
        color: #a8e6a3;
    }

    .modal-result.error {
        background-color: #4d1e1e;
        border: 1px solid #7a2d2d;
        color: #e6a3a3;
    }
</style>
{% endblock %}

{% block after_field_sets %}
{{ block.super }}

{% if original %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const messageId = {{ original.id }};

        // Добавляем кнопки к каждому полю языка
        addTestButton('message_ru', 'ru', '🇷🇺 Проверить текст (RU)');
        addTestButton('message_en', 'en', '🇬🇧 Проверить текст (EN)');
        addTestButton('message_uz', 'uz', '🇺🇿 Проверить текст (UZ)');

        function addTestButton(fieldName, language, buttonText) {
            const field = document.querySelector('.field-' + fieldName);
            if (!field) return;

            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'test-message-btn';
            button.textContent = buttonText;
            button.onclick = function() {
                openModal(language);
            };

            field.appendChild(button);
        }

        function openModal(language) {
            const modal = document.getElementById('testMessageModal');
            const languageDisplay = document.getElementById('modalLanguage');
            const userIdInput = document.getElementById('modalUserId');
            const resultDiv = document.getElementById('modalResult');

            // Устанавливаем язык
            const languageNames = {
                'ru': 'Русский 🇷🇺',
                'en': 'English 🇬🇧',
                'uz': 'O\'zbekcha 🇺🇿'
            };
            languageDisplay.textContent = languageNames[language];

            // Сохраняем язык в data-атрибут модального окна
            modal.dataset.language = language;

            // Очищаем поля
            userIdInput.value = '';
            resultDiv.style.display = 'none';
            resultDiv.className = 'modal-result';

            // Показываем модальное окно
            modal.style.display = 'block';

            // Фокус на поле ввода
            setTimeout(() => userIdInput.focus(), 100);
        }

        // Создаём модальное окно
        const modalHTML = `
            <div id="testMessageModal" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        📨 Тестовая отправка сообщения
                    </div>
                    <div class="modal-body">
                        <p><strong>Язык:</strong> <span id="modalLanguage"></span></p>
                        <label for="modalUserId">Введите Telegram User ID:</label>
                        <input type="number" id="modalUserId" placeholder="Например: 123456789">
                        <div id="modalResult" class="modal-result"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="modal-btn modal-btn-cancel" onclick="closeModal()">
                            Отмена
                        </button>
                        <button type="button" class="modal-btn modal-btn-send" onclick="sendTestMessage()">
                            Отправить
                        </button>
                    </div>
                </div>
            </div>
        `;

        document.body.insertAdjacentHTML('beforeend', modalHTML);

        // Закрытие модального окна при клике вне его
        window.onclick = function(event) {
            const modal = document.getElementById('testMessageModal');
            if (event.target === modal) {
                closeModal();
            }
        };

        // Закрытие по ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Отправка по Enter
        document.getElementById('modalUserId').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendTestMessage();
            }
        });
    });

    function closeModal() {
        document.getElementById('testMessageModal').style.display = 'none';
    }

    function sendTestMessage() {
        const modal = document.getElementById('testMessageModal');
        const language = modal.dataset.language;
        const userId = document.getElementById('modalUserId').value.trim();
        const resultDiv = document.getElementById('modalResult');
        const sendBtn = document.querySelector('.modal-btn-send');

        // Валидация
        if (!userId) {
            showResult('error', '❌ Пожалуйста, введите User ID');
            return;
        }

        // Блокируем кнопку
        sendBtn.disabled = true;
        sendBtn.textContent = '⏳ Отправка...';

        // Получаем CSRF токен
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        // Отправляем AJAX запрос
        fetch('{% url "admin:payment_messages_test_message" %}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRFToken': csrfToken
            },
            body: new URLSearchParams({
                message_id: {{ original.id }},
                language: language,
                user_id: userId
            })
        })
        .then(response => {
            // Проверяем что ответ действительно JSON
            const contentType = response.headers.get('content-type');
            if (!contentType || !contentType.includes('application/json')) {
                throw new Error('Сервер вернул не JSON. Возможно, произошла ошибка на сервере.');
            }
            return response.json();
        })
        .then(data => {
            if (data.success) {
                showResult('success', data.message);
                // Автоматически закрываем окно через 2 секунды
                setTimeout(closeModal, 2000);
            } else {
                showResult('error', data.message);
            }
        })
        .catch(error => {
            console.error('Ошибка:', error);
            showResult('error', '❌ Ошибка: ' + error.message);
        })
        .finally(() => {
            // Разблокируем кнопку
            sendBtn.disabled = false;
            sendBtn.textContent = 'Отправить';
        });
    }

    function showResult(type, message) {
        const resultDiv = document.getElementById('modalResult');
        resultDiv.className = 'modal-result ' + type;
        resultDiv.textContent = message;
        resultDiv.style.display = 'block';
    }
</script>
{% endif %}
{% endblock %}
